<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body bgcolor="aqua">
   <table cellpadding="30%"><center><h1>Student Registration Form</h1></center></table> 
    <form>
        <table cellpadding="10">
            <tr>
                <td>Name :</td>
                <td><input type="text" placeholder="Enter full name" size="40>"</td>
            </tr>
            <tr>
                <td>Father`s Name :</td>
                <td><input type="text" placeholder=" Enterfull Name" size="40"></td>
            </tr>
            <tr>
                <td>Mother´s Name :</td>
                <td><input type="text" placeholder="Enter full name" size="40"></td>
            </tr>
            <tr>
                <td>Phone Number :</td>
                <td><input type="tel" placeholder="017xxxxxxxx" size="40"></td>
            </tr>
            <tr>
                <td>Email :</td>
                <td><input type="email" placeholder="sample@example.com" size="40>"</td>

            </tr>
            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                    <input type="radio" name="gender"> Other
                </td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="text" size="5">-
                    <input type="text" size="5">-
                    <input type="text" size="8">
                    (dd-m-yyyy)
                </td>
            </tr>
            <tr>
                <td>Address :</td>
                <td>
                    <input type="tex" placeholder="Street:-house:- Road:-" size="60">
                </td>
            </tr>
            <tr>
                <td>Blood Group :</td>
                <td>
                    <select>
                        <option>select</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Department :</td>
                <td>
                    <input type="radio" name="dept">CSE
                    <input type="radio" name="dept">EEE
                    <input type="radio" name="dept">BBA
                </td>
            </tr>
            <tr>
                <td>Course :</td>
                <td>
                <input type="checkbox">C
                <input type="checkbox">C++
                <input type="checkbox">Java
                <input type="checkbox">AI
                <input type="checkbox">Machine learning
                <input type="checkbox">Robotics
                </td>
            </tr>
            <tr>
                <td>Photo :</td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td Colspan="2">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
